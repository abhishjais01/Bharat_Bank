server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:

  - job_name: observability-platform

    static_configs:
      - targets:
          - localhost
        labels:
          job: observability
          __path__: /var/log/bank/*.log

    pipeline_stages:

      - json:
          expressions:
            level: level
            logger: logger_name
            timestamp: "@timestamp"
            payload: message

      - json:
          source: payload
          expressions:
            bank_code: bankCode
            service: service
            environment: environment
            channel: channel
            event_type: eventType
            event_level: level
            trace_id: traceId

      - timestamp:
          source: timestamp
          format: RFC3339Nano

      - labels:
          bank_code:
          service:
          environment:
          channel:
          event_type:
          event_level:

      # trace_id is not a label, one stream per request would overload Loki
      - structured_metadata:
          trace_id:
