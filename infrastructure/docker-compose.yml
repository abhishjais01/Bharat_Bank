name: bank-observability

services:

  mysql:
    image: mysql:8.4
    container_name: mysql

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-observability}
      MYSQL_USER: ${MYSQL_USER:-npst}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-npst123}

    # needed so Flyway can create the audit_logs triggers
    command: --log-bin-trust-function-creators=1

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root",
             "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

    restart: unless-stopped

  loki:
    image: grafana/loki:3.1.1
    container_name: loki

    command: -config.file=/etc/loki/loki-config.yml

    ports:
      - "3100:3100"

    volumes:
      - ./loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki

    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.1.1
    container_name: promtail

    command: -config.file=/etc/promtail/promtail-config.yml

    volumes:
      - app_logs:/var/log/bank:ro
      - ./promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - promtail_positions:/tmp

    depends_on:
      - loki

    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:11.2.0
    container_name: grafana

    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"

    ports:
      - "3000:3000"

    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana

    depends_on:
      - loki
      - prometheus

    restart: unless-stopped

  logging-api:
    build:
      context: ..
      dockerfile: logging-api/Dockerfile
    container_name: logging-api

    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-observability}
      MYSQL_USER: ${MYSQL_USER:-npst}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-npst123}
      OBSERVABILITY_BANK_CODE: ${OBSERVABILITY_BANK_CODE:-NPST}
      OBSERVABILITY_ENVIRONMENT: ${OBSERVABILITY_ENVIRONMENT:-DEV}

    ports:
      - "8090:8090"

    volumes:
      - app_logs:/app/logs

    depends_on:
      mysql:
        condition: service_healthy

    restart: unless-stopped

  sample-bank-app:
    build:
      context: ..
      dockerfile: sample-bank-app/Dockerfile
    container_name: sample-bank-app

    environment:
      OBSERVABILITY_BANK_CODE: ${OBSERVABILITY_BANK_CODE:-NPST}
      OBSERVABILITY_ENVIRONMENT: ${OBSERVABILITY_ENVIRONMENT:-DEV}
      OBSERVABILITY_LOGGING_ENDPOINT: http://logging-api:8090/api/v1/logs
      OBSERVABILITY_AUDIT_ENDPOINT: http://logging-api:8090/api/v1/audit
      MOCK_CBS_BASE_URL: http://localhost:8080/mock-cbs

    ports:
      - "8080:8080"

    volumes:
      - app_logs:/app/logs

    depends_on:
      logging-api:
        condition: service_healthy

    restart: unless-stopped

volumes:
  mysql_data:
  loki_data:
  prometheus_data:
  grafana_data:
  promtail_positions:
  app_logs:
