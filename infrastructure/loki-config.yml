auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  replication_factor: 1

  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  filesystem:
    directory: /loki/chunks

ingester:
  wal:
    enabled: true
    dir: /loki/wal

limits_config:
  allow_structured_metadata: true

  retention_period: 720h

compactor:
  working_directory: /loki/compactor
  # retention_period has no effect without this
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
