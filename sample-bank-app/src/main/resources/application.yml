server:
  port: 8080

spring:
  application:
    name: sample-bank-app

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      show-details: always

  metrics:
    tags:
      application: sample-bank-app

logging:
  level:
    root: INFO

observability:

  # Identity stamped onto every log this service emits.
  # serviceName is intentionally omitted - it falls back to
  # spring.application.name, so a new microservice needs no extra config.
  bank:
    code: ${OBSERVABILITY_BANK_CODE:NPST}
    name: Bharat Bank
    environment: ${OBSERVABILITY_ENVIRONMENT:DEV}
    region: IN

  logging:
    endpoint: ${OBSERVABILITY_LOGGING_ENDPOINT:http://localhost:8090/api/v1/logs}
