# Provisioned from the repository. Previously both datasources were added by
# hand in the UI, so a recreated container lost them and nobody could
# reproduce the setup.
apiVersion: 1

datasources:

  - name: Loki
    type: loki
    access: proxy
    uid: loki
    url: http://loki:3100
    isDefault: true
    jsonData:
      # Turns a traceId in a log line into a link to that trace's other logs.
      derivedFields:
        - name: traceId
          matcherRegex: '"traceId":"([^"]+)"'
          url: '$${__value.raw}'
          datasourceUid: loki

  - name: Prometheus
    type: prometheus
    access: proxy
    uid: prometheus
    url: http://prometheus:9090
