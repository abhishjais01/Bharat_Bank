global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  - job_name: sample-bank-app
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["sample-bank-app:8080"]

  - job_name: logging-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["logging-api:8090"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
