server:
  port: ${SERVER_PORT:8090}

spring:
  application:
    name: logging-api

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:observability}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER:npst}
    password: ${MYSQL_PASSWORD:npst123}
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      pool-name: logging-api-pool
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 3000

  jpa:
    hibernate:
      ddl-auto: validate

    open-in-view: false
    show-sql: false

    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true

  data:
    web:
      pageable:
        default-page-size: 50
        max-page-size: 200

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

  metrics:
    tags:
      application: logging-api

logging:
  level:
    root: INFO

observability:

  environment: ${OBSERVABILITY_ENVIRONMENT:DEV}

  bank:
    code: ${OBSERVABILITY_BANK_CODE:NPST}
    name: Bharat Bank
    region: IN

  # logging-api must not send its own logs to itself
  sink:
    enabled: false

  retention:
    enabled: ${LOG_RETENTION_ENABLED:false}
    period: ${LOG_RETENTION_PERIOD:P90D}
    cron: "0 30 2 * * *"
    batch-size: 5000
