auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  replication_factor: 1

  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  filesystem:
    directory: /loki/chunks

ingester:
  wal:
    enabled: true
    dir: /loki/wal

limits_config:
  # Carries the trace id without indexing it. A trace id is unique per request,
  # so making it a label would create a stream per request; as structured
  # metadata it stays filterable at query time without exploding cardinality.
  allow_structured_metadata: true

  # Operational logs, not the financial record. Anything with a retention
  # obligation lives in MySQL, which keeps its own schedule.
  retention_period: 720h   # 30 days

compactor:
  working_directory: /loki/compactor
  # Retention does nothing without this; the default is to keep everything
  # forever, which quietly fills the disk.
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
